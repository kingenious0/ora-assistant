<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c160c" />
      <stop offset="65%" stop-color="#0c0a07" />
      <stop offset="100%" stop-color="#050504" />
    </radialGradient>

    <!-- Outer Ambient Halo -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Gold Orb Core Gradient -->
    <radialGradient id="goldOrbCore" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Specular Reflection Highlight -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Acoustic Bar Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Outer Acoustic Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#haloGlow)" />

  <!-- Drop Shadow Layer -->
  <circle cx="256" cy="270" r="148" fill="#000000" opacity="0.5" filter="blur(16px)" />

  <!-- Main Golden Orb Body -->
  <circle cx="256" cy="256" r="148" fill="url(#goldOrbCore)" />

  <!-- Internal Edge Shadow / Rim Light -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#fed7aa" stroke-width="3" stroke-opacity="0.35" />

  <!-- 3D Specular Sheen (Curved Light Reflection) -->
  <ellipse cx="215" cy="180" rx="55" ry="32" transform="rotate(-25 215 180)" fill="url(#specularGrad)" />

  <!-- 5 Central Acoustic Bars -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="194" y="226" width="12" height="60" rx="6" opacity="0.92" />
    <!-- Bar 2 -->
    <rect x="219" y="202" width="12" height="108" rx="6" opacity="0.95" />
    <!-- Bar 3 (Center Anchor) -->
    <rect x="244" y="184" width="12" height="144" rx="6" opacity="1.0" />
    <!-- Bar 4 -->
    <rect x="269" y="210" width="12" height="92" rx="6" opacity="0.95" />
    <!-- Bar 5 -->
    <rect x="294" y="232" width="12" height="48" rx="6" opacity="0.92" />
  </g>
</svg>
