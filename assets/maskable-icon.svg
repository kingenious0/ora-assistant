<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="mBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#17120a" />
      <stop offset="100%" stop-color="#080705" />
    </radialGradient>
    <radialGradient id="mOrb" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
  </defs>

  <!-- Full Bleed Adaptive Background -->
  <rect width="512" height="512" fill="url(#mBg)" />

  <!-- Ambient Glow in Safe Zone -->
  <circle cx="256" cy="256" r="160" fill="#f59e0b" opacity="0.18" />

  <!-- Orb Scaled into 66% Safe Zone -->
  <circle cx="256" cy="256" r="118" fill="url(#mOrb)" />
  <circle cx="256" cy="256" r="118" fill="none" stroke="#fef3c7" stroke-width="2" stroke-opacity="0.3" />

  <!-- Specular Light -->
  <ellipse cx="224" cy="196" rx="42" ry="24" transform="rotate(-25 224 196)" fill="#ffffff" opacity="0.45" />

  <!-- 5 Voice Bars (Proportional to Safe Zone) -->
  <g fill="#ffffff">
    <rect x="206" y="232" width="10" height="48" rx="5" opacity="0.9" />
    <rect x="226" y="213" width="10" height="86" rx="5" opacity="0.95" />
    <rect x="246" y="198" width="10" height="116" rx="5" opacity="1.0" />
    <rect x="266" y="220" width="10" height="72" rx="5" opacity="0.95" />
    <rect x="286" y="237" width="10" height="38" rx="5" opacity="0.9" />
  </g>
</svg>
